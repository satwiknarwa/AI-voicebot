<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🎙️ Voice Chatbot</title>
  <style>
    /* 🌈 Background gradient */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    /* 💬 Main Chat Container */
    .chat-container {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 480px;
      max-width: 95%;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* keeps input bar fixed at bottom */
      height: 85vh;
    }

    h2 {
      text-align: center;
      color: #3f51b5;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h2::before {
      content: "🎤";
    }

    /* 🗨️ Chat box with auto-scroll */
    .chat-box {
      background: #f3e5f5;
      border-radius: 15px;
      padding: 15px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .message.user {
      background: #d1c4e9;
      align-self: flex-end;
      color: #311b92;
      font-weight: 500;
    }

    .message.bot {
      background: #ede7f6;
      align-self: flex-start;
      color: #4a148c;
    }

    /* 📨 Input area */
    .input-area {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f3e5f5;
      border-radius: 20px;
      padding: 10px 15px;
      margin-top: 10px;
    }

    textarea {
      flex: 1;
      height: 60px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      resize: none;
      background: transparent;
    }

    button {
      background: #7b1fa2;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #9c27b0;
    }

    hr {
      border: 0;
      height: 1px;
      background: #ddd;
      margin: 15px 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 16px;
      color: #4a148c;
      margin-top: 5px;
    }

    .output-box {
      background: #f3e5f5;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 15px;
      color: #333;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    #recordBtn {
      background: #8e24aa;
      margin-top: 10px;
    }

    #recordBtn:hover {
      background: #9c27b0;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h2>Voice Chatbot</h2>

    <!-- 💬 Chat Display -->
    <div class="chat-box" id="chatBox">
      <div class="message bot">👋 Hello! How can I help you today?</div>
    </div>

    <!-- 📨 Text Input Area -->
    <div class="input-area">
      <textarea id="message" placeholder="Type your message..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>

    <hr>

    <!-- 🎤 Voice Section -->
    <div class="section-title">🎙️ Speak to the Bot</div>
    <button id="recordBtn">🎙️ Start Recording</button>

    <div class="output-box"><strong>Transcript:</strong> <span id="transcript"></span></div>
    <div class="output-box"><strong>Reply:</strong> <span id="audioReply"></span></div>
    <audio id="replyAudio" controls hidden style="width:100%; margin-top:8px;"></audio>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const recordBtn = document.getElementById("recordBtn");
    const messageBox = document.getElementById("message");
    const transcriptBox = document.getElementById("transcript");
    const audioReplyBox = document.getElementById("audioReply");
    const replyAudio = document.getElementById("replyAudio");

    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];
    let activeAudioUrl = null;

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Use textContent instead of interpolating user/AI text into innerHTML.
    function appendMessage(text, role) {
      const item = document.createElement("div");
      item.className = "message " + role;
      item.textContent = String(text || "");
      chatBox.appendChild(item);
      scrollToBottom();
    }

    async function readJsonResponse(response) {
      let data;
      try {
        data = await response.json();
      } catch (_) {
        throw new Error("The server returned an unreadable response.");
      }
      if (!response.ok) {
        throw new Error(data.error || "Request failed with status " + response.status);
      }
      return data;
    }

    async function requestAndDisplayReply(message) {
      try {
        const response = await fetch("/chat_with_ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });
        const data = await readJsonResponse(response);
        appendMessage(data.reply, "bot");
        audioReplyBox.textContent = data.reply;
        await speakReply(data.reply);
      } catch (error) {
        appendMessage("Sorry, " + error.message, "bot");
      }
    }

    async function sendMessage() {
      const message = messageBox.value.trim();
      if (!message) return;
      appendMessage(message, "user");
      messageBox.value = "";
      messageBox.focus();
      await requestAndDisplayReply(message);
    }

    async function speakReply(text) {
      if (!text) return;
      try {
        const response = await fetch("/text_to_speech/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Speech synthesis failed.");
        }

        const audioBlob = await response.blob();
        if (activeAudioUrl) URL.revokeObjectURL(activeAudioUrl);
        activeAudioUrl = URL.createObjectURL(audioBlob);
        replyAudio.src = activeAudioUrl;
        replyAudio.hidden = false;
        replyAudio.load();
        // Autoplay may be blocked; visible controls remain available.
        try {
          await replyAudio.play();
        } catch (_) {
          replyAudio.controls = true;
        }
      } catch (error) {
        audioReplyBox.textContent = text + " (Audio unavailable: " + error.message + ")";
      }
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Microphone recording requires a supported browser and HTTPS or localhost.");
      }
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(mediaStream);
      audioChunks = [];

      mediaRecorder.addEventListener("dataavailable", function (event) {
        if (event.data && event.data.size > 0) audioChunks.push(event.data);
      });

      mediaRecorder.addEventListener("stop", async function () {
        recordBtn.disabled = true;
        recordBtn.textContent = "Processing recording...";
        try {
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const formData = new FormData();
          formData.append("audio", audioBlob, "recording.webm");

          const response = await fetch("/process_audio/", {
            method: "POST",
            body: formData
          });
          const data = await readJsonResponse(response);
          transcriptBox.textContent = data.text || "No speech detected.";
          if (data.text) {
            appendMessage(data.text, "user");
            await requestAndDisplayReply(data.text);
          }
        } catch (error) {
          transcriptBox.textContent = error.message;
          appendMessage("Audio error: " + error.message, "bot");
        } finally {
          if (mediaStream) {
            mediaStream.getTracks().forEach(function (track) { track.stop(); });
            mediaStream = null;
          }
          recordBtn.disabled = false;
          recordBtn.textContent = "🎙️ Start Recording";
        }
      });

      mediaRecorder.start();
      recordBtn.textContent = "⏹️ Stop Recording";
    }

    recordBtn.addEventListener("click", async function () {
      try {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
        } else {
          await startRecording();
        }
      } catch (error) {
        if (mediaStream) {
          mediaStream.getTracks().forEach(function (track) { track.stop(); });
          mediaStream = null;
        }
        recordBtn.textContent = "🎙️ Start Recording";
        appendMessage("Microphone error: " + error.message, "bot");
      }
    });

    messageBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
